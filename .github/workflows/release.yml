name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_release:
        description: 'Test release (skips PyPI publish)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0  # Required for version detection

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: dist-sdist
        path: dist/*.tar.gz

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0  # Required for version detection

    - uses: pypa/cibuildwheel@v3.3

    - name: Verify clean directory
      run: git diff --exit-code
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        path: wheelhouse/*.whl
        name: dist-${{ matrix.os }}

  test_install:
    name: Test installation
    needs: [build_wheels, build_sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: dist-*
        merge-multiple: true

    - name: Install from wheel
      shell: bash
      run: |
        python -m pip install pytest
        python -m pip install dist/*.whl

    - name: Test import
      run: python -c "import ultrack_td; print(ultrack_td.__version__)"

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, test_install]
    runs-on: ubuntu-latest
    # Only run on main repo and not for test releases
    if: github.repository == 'royerlab/ultrack-td' && github.event.inputs.test_release != 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/ultrack-td

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: dist-*
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        attestations: true

  test_release:
    name: Test release (dry run)
    needs: [build_wheels, build_sdist, test_install]
    runs-on: ubuntu-latest
    # Only run for test releases or on forks
    if: github.event.inputs.test_release == 'true' || github.repository != 'royerlab/ultrack-td'

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: dist-*
        merge-multiple: true

    - name: Test PyPI upload (dry run)
      run: |
        echo "🧪 This would upload to PyPI:"
        ls -la dist/
        echo "✅ Test release completed successfully!"

  github_release:
    name: Create GitHub Release
    needs: [build_wheels, build_sdist, test_install]
    runs-on: ubuntu-latest
    # Only create GitHub releases on main repo and not for test releases
    if: github.repository == 'royerlab/ultrack-td' && github.event.inputs.test_release != 'true'

    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: dist-*
        merge-multiple: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
